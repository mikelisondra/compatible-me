<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compatible Me.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-50">

    <button id="mute-btn" onclick="toggleMute()" class="absolute top-4 right-4 bg-white shadow-md p-2 rounded-full text-xs font-bold z-50 hover:bg-gray-100 transition">🔊 Sound On</button>

    <div class="w-full max-w-md p-6 bg-white rounded-xl shadow-2xl border-t-8 border-indigo-600 transition-all duration-300">
        <h1 class="text-4xl font-black text-center text-indigo-600 mb-1 tracking-tighter">Compatible Me<span class="text-sm align-top text-gray-400">.io</span></h1>
        
        <div id="start-screen">
            <p class="text-center text-gray-400 text-xs font-bold uppercase mb-6 tracking-widest">Social Sync Game</p>
            
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Nickname</label>
            <input type="text" id="username" placeholder="Enter Your Name" class="w-full p-4 border-2 border-gray-200 rounded-xl mb-6 text-center font-bold text-lg focus:border-indigo-500 outline-none text-indigo-600">
            
            <div class="space-y-3">
                <button onclick="goToHost()" class="w-full p-4 bg-indigo-50 border-2 border-indigo-100 rounded-xl flex items-center justify-between hover:bg-indigo-100 hover:border-indigo-300 transition group">
                    <span class="text-left">
                        <span class="block font-black text-indigo-700 text-lg">👑 HOST A GAME</span>
                        <span class="block text-xs text-indigo-400 font-bold">Create room & settings</span>
                    </span>
                    <span class="text-2xl group-hover:scale-110 transition">➡️</span>
                </button>

                <button onclick="goToGuest()" class="w-full p-4 bg-white border-2 border-gray-200 rounded-xl flex items-center justify-between hover:bg-gray-50 hover:border-gray-300 transition group">
                    <span class="text-left">
                        <span class="block font-black text-gray-600 text-lg">👋 JOIN A ROOM</span>
                        <span class="block text-xs text-gray-400 font-bold">Enter a code to play</span>
                    </span>
                    <span class="text-2xl group-hover:scale-110 transition">➡️</span>
                </button>
            </div>
        </div>

        <div id="host-panel" class="hidden">
            <button onclick="goBack()" class="mb-4 text-xs font-bold text-gray-400 hover:text-gray-600 flex items-center gap-1">⬅ BACK</button>
            <h2 class="text-xl font-black text-indigo-900 mb-4">ROOM SETTINGS</h2>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="selectMode('1v1')" id="btn-1v1" class="mode-btn p-3 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold flex flex-col items-center gap-1 transition"><span class="text-2xl">❤️</span><span class="text-xs">1v1 Duel</span></button>
                <button onclick="selectMode('party')" id="btn-party" class="mode-btn p-3 rounded-xl border-2 border-gray-200 text-gray-400 font-bold flex flex-col items-center gap-1 transition"><span class="text-2xl">🎉</span><span class="text-xs">Party</span></button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <select id="game-type" onchange="toggleCustomInputs()" class="w-full p-2 border-2 rounded font-bold text-gray-700 text-sm bg-white"><option value="ranking">📊 Ranking</option><option value="trivia">❓ Trivia</option></select>
                <select id="topic-source" onchange="toggleCustomInputs()" class="w-full p-2 border-2 rounded font-bold text-gray-700 text-sm bg-white"><option value="random">🎲 Random</option><option value="custom">✏️ Custom</option></select>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Rounds</label>
                    <select id="round-setting" class="w-full p-2 border-2 rounded font-bold text-gray-700 text-sm bg-white">
                        <option value="1">1 Round</option>
                        <option value="3">3 Rounds</option>
                        <option value="5">5 Rounds</option>
                        <option value="10">10 Rounds</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Timer</label>
                    <select id="timer-setting" class="w-full p-2 border-2 rounded font-bold text-gray-700 text-sm bg-white">
                        <option value="0">No Timer</option>
                        <option value="10">10 Seconds</option>
                        <option value="20">20 Seconds</option>
                        <option value="30">30 Seconds</option>
                    </select>
                </div>
            </div>

            <div class="mb-2">
                <label class="flex items-center gap-3 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition bg-white">
                    <input type="checkbox" id="sync-mode" class="w-5 h-5 accent-indigo-600" checked>
                    <div>
                        <span class="block text-sm font-bold text-gray-700">Sync Timers</span>
                        <span class="block text-xs text-gray-400">Guests wait for Host to answer first</span>
                    </div>
                </label>
            </div>

            <div class="mb-4 p-3 border-2 border-gray-200 rounded-xl bg-white flex items-center justify-between shadow-sm hover:border-indigo-300 transition-colors">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="simple-mode" class="w-5 h-5 accent-indigo-600 cursor-pointer">
                    <label for="simple-mode" class="text-gray-700 font-bold text-sm cursor-pointer select-none">
                        Simplified Text
                    </label>
                </div>
                <div class="group relative flex items-center justify-center ml-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-400 hover:text-indigo-600 cursor-help transition-colors">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                    </svg>
                    <div class="absolute bottom-full right-0 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10 text-center leading-relaxed font-medium">
                        Shows just the question text for a cleaner look.
                        <div class="absolute top-full right-2 -mt-1 border-4 border-transparent border-t-gray-800"></div>
                    </div>
                </div>
            </div>

            <div id="custom-inputs" class="hidden mb-6 bg-indigo-50 p-4 rounded-xl border-2 border-indigo-100 relative transition-all">
                
                <div class="flex justify-between items-center mb-3">
                    <span id="slide-counter" class="bg-indigo-200 text-indigo-700 text-xs font-bold px-2 py-1 rounded">ROUND 1</span>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <span class="text-xs font-bold text-gray-400 uppercase">Lock Answer?</span>
                        <input type="checkbox" id="slide-lock" onchange="toggleLock()" class="accent-indigo-600 w-4 h-4">
                    </label>
                </div>
            
                <input type="text" id="slide-q" class="w-full p-3 border-2 border-indigo-100 rounded-lg mb-3 text-sm font-bold text-indigo-900 focus:border-indigo-500 outline-none" placeholder="Type Question Here...">
                
                <div id="setup-list" class="grid grid-cols-1 gap-2 mb-4">
                    <div class="flex items-center gap-2 bg-white p-2 border rounded border-gray-200">
                        <span class="drag-handle cursor-move text-gray-400 hover:text-indigo-600 px-1">☰</span>
                        <input type="radio" name="correct-ans" value="0" class="ans-radio hidden accent-green-500 w-5 h-5">
                        <input type="text" class="slide-item w-full text-sm outline-none bg-transparent" placeholder="Option 1">
                    </div>
                    <div class="flex items-center gap-2 bg-white p-2 border rounded border-gray-200">
                        <span class="drag-handle cursor-move text-gray-400 hover:text-indigo-600 px-1">☰</span>
                        <input type="radio" name="correct-ans" value="1" class="ans-radio hidden accent-green-500 w-5 h-5">
                        <input type="text" class="slide-item w-full text-sm outline-none bg-transparent" placeholder="Option 2">
                    </div>
                    <div class="flex items-center gap-2 bg-white p-2 border rounded border-gray-200">
                        <span class="drag-handle cursor-move text-gray-400 hover:text-indigo-600 px-1">☰</span>
                        <input type="radio" name="correct-ans" value="2" class="ans-radio hidden accent-green-500 w-5 h-5">
                        <input type="text" class="slide-item w-full text-sm outline-none bg-transparent" placeholder="Option 3">
                    </div>
                    <div class="flex items-center gap-2 bg-white p-2 border rounded border-gray-200">
                        <span class="drag-handle cursor-move text-gray-400 hover:text-indigo-600 px-1">☰</span>
                        <input type="radio" name="correct-ans" value="3" class="ans-radio hidden accent-green-500 w-5 h-5">
                        <input type="text" class="slide-item w-full text-sm outline-none bg-transparent" placeholder="Option 4">
                    </div>
                    <div id="cont-item-5" class="flex items-center gap-2 bg-white p-2 border rounded border-gray-200 hidden">
                        <span class="drag-handle cursor-move text-gray-400 hover:text-indigo-600 px-1">☰</span>
                        <input type="radio" name="correct-ans" value="4" class="ans-radio hidden accent-green-500 w-5 h-5">
                        <input type="text" id="slide-item-5" class="slide-item w-full text-sm outline-none bg-transparent" placeholder="Option 5">
                    </div>
                </div>
            
                <div class="flex justify-between gap-2">
                    <button onclick="prevSlide()" id="btn-prev" class="flex-1 py-2 rounded-lg font-bold text-xs bg-gray-200 text-gray-500 hover:bg-gray-300 transition disabled:opacity-50">⬅ PREV</button>
                    <button onclick="nextSlide()" id="btn-next" class="flex-1 py-2 rounded-lg font-bold text-xs bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-md">NEXT ROUND ➡</button>
                </div>
            </div>

            <div class="flex mb-4 bg-gray-100 p-1 rounded-lg">
                <button onclick="setDiff('casual')" id="btn-casual" class="flex-1 py-2 rounded-md font-bold text-xs bg-white shadow text-indigo-600 transition">Casual</button>
                <button onclick="setDiff('standard')" id="btn-standard" class="flex-1 py-2 rounded-md font-bold text-xs text-gray-500 transition">Challenge</button>
            </div>
            
            <div id="slider-box" class="hidden mb-4 bg-indigo-50 p-4 rounded-lg">
                <div class="flex justify-between text-xs font-bold text-indigo-500 mb-2"><span>PASSING GRADE</span> <span id="slider-val">90%</span></div>
                <input type="range" id="target-slider" min="50" max="100" value="90" class="w-full accent-indigo-600" oninput="document.getElementById('slider-val').innerText = this.value + '%'">
            </div>

            <button onclick="createGame()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition text-lg">CREATE ROOM 🚀</button>
        </div>

        <div id="guest-panel" class="hidden">
            <button onclick="goBack()" class="mb-4 text-xs font-bold text-gray-400 hover:text-gray-600 flex items-center gap-1">⬅ BACK</button>
            <h2 class="text-xl font-black text-gray-800 mb-6">JOIN A ROOM</h2>
            
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Room Code</label>
            <input type="text" id="room-code" placeholder="CODE" class="w-full p-4 border-2 border-gray-200 rounded-xl uppercase text-center font-bold text-2xl tracking-widest mb-6 focus:border-indigo-500 outline-none">
            
            <button onclick="joinGame()" class="w-full bg-gray-800 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-gray-900 active:scale-95 transition text-lg">JOIN GAME 🎮</button>
        </div>

        <div id="lobby-screen" class="hidden text-center">
            <div class="inline-block px-3 py-1 bg-gray-100 rounded-full text-xs font-bold text-gray-500 uppercase mb-4" id="lobby-tag"></div>
            <div id="display-code" class="text-6xl font-black text-indigo-600 tracking-widest mb-8 font-mono"></div>
            <ul id="player-list" class="space-y-2 mb-8 text-gray-700 font-medium text-sm"></ul>
            <button id="start-btn" onclick="startGame()" class="hidden w-full bg-green-500 text-white p-4 rounded-xl font-bold shadow hover:bg-green-600 animate-bounce">START GAME</button>
            <p id="wait-msg" class="text-sm text-gray-400 italic">Waiting for host...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="text-xs font-bold bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full uppercase" id="game-badge"></span>
                <div id="timer-box" class="hidden text-xl font-black text-red-500 border-2 border-red-100 bg-red-50 px-3 py-1 rounded-lg">
                    ⏰ <span id="timer-val">10</span>
                </div>
            </div>
            
            <p id="round-indicator" class="text-xs text-gray-400 font-bold uppercase text-center mb-2"></p>
            <p id="q-text" class="text-center font-bold text-gray-800 mb-8 text-xl leading-tight"></p>
            <ul id="sortable-list" class="space-y-3 mb-8 hidden"></ul>
            <div id="trivia-grid" class="grid grid-cols-2 gap-3 mb-8 hidden"></div>
            <button onclick="submitAnswer()" id="submit-btn" class="hidden w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow hover:bg-indigo-700 active:scale-95 transition">Lock It In</button>
            <p id="status-msg" class="text-center text-sm text-gray-400 mt-4 h-5 font-medium"></p>
        </div>

        <div id="result-screen" class="hidden text-center">
            <div id="res-final" class="hidden">
                <div id="res-1v1" class="hidden">
                    <div class="text-6xl mb-2 heart-pulse">💖</div>
                    <div class="text-8xl font-black text-indigo-600 mb-2" id="score-1v1">0%</div>
                    <p id="msg-1v1" class="text-gray-500 font-medium mb-8"></p>
                </div>
                <div id="res-party" class="hidden">
                    <h2 class="text-3xl font-black text-gray-800 mb-6">FINAL LEADERBOARD</h2>
                    <div id="leaderboard" class="space-y-3 mb-8"></div>
                </div>
                
                <button onclick="reloadGame()" class="w-full bg-gray-800 text-white p-4 rounded-xl font-bold hover:bg-gray-700 shadow-lg mb-3">Play Again</button>
                
                <button onclick="swapRoles()" class="w-full bg-white border-2 border-indigo-200 text-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-50 hover:border-indigo-300 transition shadow-sm">
                    🔄 Swap Roles
                </button>
            </div>
            <div id="res-round" class="hidden"></div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
